# Publica la carpeta web/ en GitHub Pages cada vez que cambia en main.
# Sitio: https://gersainbarron.github.io/gemelo-digital-medicamentos/
name: Publicar la web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:   # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# una publicación a la vez; si llega otra, la nueva espera y la vieja termina
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
